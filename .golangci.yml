version: "2"

run:
  timeout: 5m
  allow-serial-runners: true

linters:
  default: standard
  enable:
    - errorlint
    - gocyclo
    - misspell
    - nilerr
    - revive
    - unconvert
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
  settings:
    misspell:
      locale: US
    gocyclo:
      min-complexity: 15

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
